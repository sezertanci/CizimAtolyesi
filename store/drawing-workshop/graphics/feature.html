<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Öne çıkan görsel</title>
<!-- Play öne çıkan görseli (1024×500). Dil "?lang=en" ile seçilir; render (proje kökünden):
     chrome --headless --hide-scrollbars --allow-file-access-from-files --window-size=1024,500
            --screenshot=store/drawing-workshop/graphics/feature-graphic-tr.png
            "file:///<proje-yolu>/store/drawing-workshop/graphics/feature.html?lang=tr" -->
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(circle at 12.5% 36%, #C4B5FD 0, #8B5CF6 16%, #6D28D9 32%, #4C1D95 55%, #2E1065 85%);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .brand { position: absolute; left: 64px; top: 0; bottom: 0; width: 470px;
           display: flex; flex-direction: column; justify-content: center; }
  .brand img { width: 128px; height: 128px; border-radius: 30px;
               box-shadow: 0 0 46px 10px rgba(221, 214, 254, .55), 0 10px 26px rgba(20, 0, 50, .4); }
  h1 { margin: 26px 0 8px; font-size: 64px; line-height: 1.05; font-weight: 800; color: #FFFFFF;
       text-shadow: 0 3px 10px rgba(20, 0, 50, .45); }
  p { margin: 0; font-size: 28px; font-weight: 600; color: #FDE68A;
      text-shadow: 0 2px 8px rgba(20, 0, 50, .45); }
  .card { position: absolute; width: 300px; height: 214px; background: #fff; border-radius: 22px;
          box-shadow: 0 12px 30px rgba(10, 0, 30, .45); padding: 12px; box-sizing: border-box; }
  .card img { width: 100%; height: 100%; }
  .c1 { left: 560px; top: 40px; transform: rotate(-6deg); }
  .c2 { left: 700px; top: 238px; transform: rotate(5deg); }
  .dot { position: absolute; border-radius: 50%; }
</style>
</head>
<body>
  <div class="brand">
    <img src="icon-512.png" alt="">
    <h1 id="title">Çizim Atölyesi</h1>
    <p id="tagline">Çiz, boya, hayal et!</p>
  </div>
  <div class="card c1"><img src="../../../tools/coloring/pages/owl.svg" alt=""></div>
  <div class="card c2"><img src="../../../tools/coloring/pages/rocket.svg" alt=""></div>
  <div class="dot" style="left:930px;top:60px;width:46px;height:46px;background:#E53935"></div>
  <div class="dot" style="left:600px;top:330px;width:38px;height:38px;background:#1E88E5"></div>
  <div class="dot" style="left:965px;top:190px;width:28px;height:28px;background:#43A047"></div>
  <div class="dot" style="left:660px;top:420px;width:24px;height:24px;background:#EC407A"></div>
  <div class="dot" style="left:520px;top:60px;width:26px;height:26px;background:#FB8C00"></div>
<script>
  if (new URLSearchParams(location.search).get("lang") === "en") {
    document.documentElement.lang = "en";
    document.getElementById("title").textContent = "Drawing Workshop";
    document.getElementById("tagline").textContent = "Draw, colour, imagine!";
  }
</script>
</body>
</html>
